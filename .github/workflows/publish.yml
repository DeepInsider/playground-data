name: Publish to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build --no-sources --out-dir dist/release
      - run: uv run twine check --strict dist/release/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/release/
